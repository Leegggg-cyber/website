        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .music-list {
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .music-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            gap: 15px;
        }

        .music-item:last-child {
            border-bottom: none;
        }

        .music-icon {
            font-size: 25px;
        }

        .music-name {
            flex: 1;
        }

        .music-name a {
            color: #333;
            text-decoration: none;
            font-size: 16px;
        }

        .music-name a:hover {
            color: #007bff;
        }

        audio {
            width: 250px;
        }

        @media (max-width: 700px) {
            .music-item {
                flex-wrap: wrap;
            }

            .music-name {
                width: 100%;
                flex: none;
            }

            audio {
                width: 100%;
            }
        }
    </style>
</head>
